        let group = new TWEEN.Group(); // ternan el crack carajo

        audio.volume = 0;

        const twelen = new TWEEN.Tween(audio);
        twelen.to({volume: getAudioVar('volume')}, 2000);
        twelen.onComplete(function() {
          colume.disabled = false;
        });
        twelen.start();
        twelen.easing(TWEEN.Easing.Sinusoidal.In);
        group.add(twelen);

        const si = new TWEEN.Tween(canvas.style);
        si.to({opacity: 0}, 2000);
        si.start();
        si.easing(TWEEN.Easing.Sinusoidal.In);
        si.onComplete(function() {
          canvas.remove();
        });
        group.add(si);

        
      function animate() {
          group.update();

          requestAnimationFrame(animate);
        }

        animate();

        localStorage.removeItem('aserfade');
