  <button class="boton" onclick="clearLocalStorage()">borrar cuenta de free fire (localstorage)</button>


    <canvas id="lantas" style="position: fixed;"></canvas>

    <audio id="oudio" muted="true" autoplay="true">
      <source src="audio/WEBMIX2.wav" type="audio/wav" />
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/25.0.0/tween.umd.js"></script>
    <script src="scripts/player.js"></script>

    <script>
      var localStorage = Window.localStorage;

      if (!localStorage.getItem('pasado')) window.location.href = 'login.html';

      var audio = document.getElementById('oudio');
      audio.muted = false;
      audio.volume = 0;

      var canvas = document.getElementById('lantas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.opacity = 1;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = "white";
      ctx.rect(0, 0, window.innerWidth, window.innerHeight);
      ctx.fill();

      let group = new TWEEN.Group();

      const twelen = new TWEEN.Tween(audio);
      twelen.to({volume: 1}, 2000);
      twelen.start();
      twelen.easing(TWEEN.Easing.Sinusoidal.In);
      group.add(twelen);

      const si = new TWEEN.Tween(canvas.style);
      si.to({opacity: 0}, 2000);
      si.start();
      si.easing(TWEEN.Easing.Sinusoidal.In);
      si.onComplete(function() {
        canvas.remove();
      });
      group.add(si);

      function animate() {
        group.update();
        requestAnimationFrame(animate);
      }

      animate();

      function clearLocalStorage() {
      localStorage.clear(); 
      alert('tu cuenta de free fire ha sido borrada');
    }

    </script>
